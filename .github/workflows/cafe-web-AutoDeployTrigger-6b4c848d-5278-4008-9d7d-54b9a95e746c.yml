name: Trigger auto deployment for cafe-web

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/cafe-web-AutoDeployTrigger-6b4c848d-5278-4008-9d7d-54b9a95e746c.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CAFEWEB_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CAFEWEB_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CAFEWEB_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/CafeOrderSystem.Client
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: ghcr.io
          registryUsername: ${{ secrets.CAFEWEB_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CAFEWEB_REGISTRY_PASSWORD }}
          containerAppName: cafe-web
          resourceGroup: DevOpsTest
          imageToBuild: ghcr.io/cafe-web:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


