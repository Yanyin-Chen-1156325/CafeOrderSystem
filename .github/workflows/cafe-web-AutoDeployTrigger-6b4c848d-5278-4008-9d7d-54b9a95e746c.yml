name: Trigger auto deployment for cafe-web

on:
  push:
    branches:
      [ main ]
    paths:
    - '**'
    - '.github/workflows/cafe-web-AutoDeployTrigger-6b4c848d-5278-4008-9d7d-54b9a95e746c.yml'

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Set lowercase owner
        run: echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CAFEWEB_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CAFEWEB_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CAFEWEB_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: CafeOrderSystem.Client/Dockerfile
          registryUrl: ghcr.io
          registryUsername: ${{ secrets.CAFEWEB_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CAFEWEB_REGISTRY_PASSWORD }}
          containerAppName: cafe-web
          resourceGroup: DevOpsTest
          imageToBuild: ghcr.io/${{ env.OWNER }}/cafe-web:${{ github.sha }}
          buildArguments: VITE_API_BASE_URL=/api
