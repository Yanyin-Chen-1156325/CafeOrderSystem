name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push API image
        run: |
          docker build -f CafeOrderSystem.Api/Dockerfile \
            -t ghcr.io/${{ github.repository_owner }}/cafe-api:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/cafe-api:latest \
            .
          docker push ghcr.io/${{ github.repository_owner }}/cafe-api:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/cafe-api:latest

      - name: Build & Push Web image
        run: |
          docker build -f CafeOrderSystem.Client/Dockerfile \
            --build-arg VITE_API_BASE_URL=/api \
            --build-arg VITE_STRIPE_PUBLISHABLE_KEY=${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }} \
            -t ghcr.io/${{ github.repository_owner }}/cafe-web:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/cafe-web:latest \
            .
          docker push ghcr.io/${{ github.repository_owner }}/cafe-web:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/cafe-web:latest

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy API to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: cafe-api
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          imageToDeploy: ghcr.io/${{ github.repository_owner }}/cafe-api:${{ github.sha }}

      - name: Deploy Web to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          containerAppName: cafe-web
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          imageToDeploy: ghcr.io/${{ github.repository_owner }}/cafe-web:${{ github.sha }}
