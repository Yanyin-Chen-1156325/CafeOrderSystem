name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-api:
    name: Build API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore CafeOrderSystem.Api/CafeOrderSystem.Api.csproj

      - name: Build
        run: dotnet build CafeOrderSystem.Api/CafeOrderSystem.Api.csproj --no-restore -c Release

  build-client:
    name: Build Client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: CafeOrderSystem.Client/package-lock.json

      - name: Install
        run: npm ci
        working-directory: CafeOrderSystem.Client

      - name: Build
        run: npm run build
        working-directory: CafeOrderSystem.Client
        env:
          VITE_API_BASE_URL: /api

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [build-api, build-client]
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f CafeOrderSystem.Api/Dockerfile -t cafe-api:ci .

      - name: Build Web image
        run: |
          docker build -f CafeOrderSystem.Client/Dockerfile \
            --build-arg VITE_API_BASE_URL=/api \
            -t cafe-web:ci .
